name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --lib --tests -- -D warnings

      - name: Test
        run: cargo test

      - name: Wasm build
        # Equivalent to `stellar contract build` for CI's purpose — proves the
        # contract compiles to the Soroban wasm target — without compiling the
        # Stellar CLI from source, which is slow and flaky on runners.
        run: cargo build --locked --release --target wasm32v1-none
