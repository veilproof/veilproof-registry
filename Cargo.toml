[package]
name = "veilproof-registry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "On-chain ZK credential verifier and registry for Soroban, using native BN254 proof verification."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=25.3.2"

[dev-dependencies]
soroban-sdk = { version = "=25.3.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
