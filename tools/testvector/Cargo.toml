[package]
name = "veilproof-testvector"
version = "0.1.0"
edition = "2021"
publish = false

# Development-only tool. It is NOT part of the contract's wasm build; it runs
# natively to produce one real Groth16 proof (VK + proof + public inputs),
# serialized into Soroban's exact BN254 encoding, and writes it to
# ../../src/test_vector.rs so the contract's test suite verifies a genuine
# proof rather than a synthetic placeholder.

[[bin]]
name = "gen-test-vector"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = "0.5"
ark-r1cs-std = { version = "0.5", default-features = false }
ark-snark = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"

[workspace]
